<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Физика ОГЭ — Конструктор схем</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --accent-color: var(--tg-theme-button-color, #3390ec);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f9);
            --hint-color: var(--tg-theme-hint-color, #a8a8a8);
            --success-color: #4caf50;
            --error-color: #f44336;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
            text-align: center;
            background: linear-gradient(90deg, var(--accent-color), #8e44ad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .subtitle {
            font-size: 13px;
            color: var(--hint-color);
            margin-bottom: 16px;
            text-align: center;
        }

        .card {
            background: var(--secondary-bg);
            border-radius: 20px;
            padding: 16px;
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }

        h3 {
            margin-top: 0;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }

        button {
            background-color: var(--accent-color);
            color: var(--button-text);
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex: 1;
            transition: transform 0.1s, filter 0.2s;
        }
        button:active { transform: scale(0.97); }
        button.secondary {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--hint-color);
        }

        .resistor-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 140px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .resistor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
        }

        .resistor-item span {
            color: var(--accent-color);
        }

        .del-btn {
            background: none;
            border: none;
            color: var(--error-color);
            font-weight: bold;
            cursor: pointer;
            padding: 0 4px;
            font-size: 16px;
            flex: none;
        }

        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: none;
            border-radius: 12px;
            background-color: var(--bg-color);
            box-sizing: border-box;
            color: var(--text-color);
            font-weight: 600;
            margin-bottom: 10px;
        }
        input:focus { outline: 2px solid var(--accent-color); }

        #result {
            font-weight: 600;
            text-align: center;
            font-size: 14px;
            padding: 8px;
            border-radius: 10px;
            margin-top: 8px;
        }

        .scheme-type {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .scheme-type label {
            flex: 1;
            background: var(--bg-color);
            padding: 8px;
            text-align: center;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
        }
        .scheme-type input[type="radio"] { display: none; }
        .scheme-type input[type="radio"]:checked + span { color: var(--accent-color); }
        .scheme-type label:has(input:checked) { border-color: var(--accent-color); }
    </style>
</head>
<body>

    <h1>Конструктор цепей</h1>
    <div class="subtitle">Собери схему и рассчитай параметры</div>

    <!-- НАСТРОЙКА ЦЕПИ -->
    <div class="card">
        <h3>1. Тип соединения</h3>
        <div class="scheme-type">
            <label>
                <input type="radio" name="connection" value="series" checked onchange="updateCalc()">
                <span>Последовательное</span>
            </label>
            <label>
                <input type="radio" name="connection" value="parallel" onchange="updateCalc()">
                <span>Параллельное</span>
            </label>
        </div>

        <h3>2. Резисторы в цепи</h3>
        <div class="btn-row">
            <button onclick="addResistor()">+ Добавить резистор</button>
            <button class="secondary" onclick="clearResistors()">Очистить</button>
        </div>
        <div id="resistorList" class="resistor-list">
            <!-- Сюда добавляются резисторы -->
        </div>
       
        <div style="font-size: 13px; color: var(--hint-color); text-align: center;">
            Источник питания: <strong style="color: var(--text-color);">6.0 В</strong>
        </div>
    </div>

    <!-- ПРОВЕРКА ЗНАЧЕНИЙ -->
    <div class="card">
        <h3>3. Проверка расчетов</h3>
        <div style="font-size: 13px; margin-bottom: 8px;">Введите общее сопротивление цепи ($R_{общ}$ в Ом):</div>
        <input type="number" id="userR" placeholder="Например: 15">
       
        <div style="font-size: 13px; margin-bottom: 8px;">Введите общий ток в цепи ($I_{общ}$ в А):</div>
        <input type="number" id="userI" placeholder="Например: 0.4">

        <button onclick="checkAnswers()">Проверить себя</button>
        <p id="result"></p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let resistors = [10, 20]; // Стартовые резисторы по умолчанию

        function renderResistors() {
            let list = document.getElementById('resistorList');
            list.innerHTML = "";
           
            if (resistors.length === 0) {
                list.innerHTML = `<div style="text-align:center; color:var(--hint-color); padding: 10px;">Нет резисторов</div>`;
                return;
            }

            resistors.forEach((r, index) => {
                let item = document.createElement('div');
                item.className = 'resistor-item';
                item.innerHTML = `Резистор #${index + 1}: <span>${r} Ом</span> <button class="del-btn" onclick="removeResistor(${index})">&times;</button>`;
                list.appendChild(item);
            });
            updateCalc();
        }

        function addResistor() {
            // Случайный номинал от 5 до 50 Ом для удобства
            let randomR = Math.floor(Math.random() * 10) * 5 + 5;
            resistors.push(randomR);
            renderResistors();
        }

        function removeResistor(index) {
            resistors.splice(index, 1);
            renderResistors();
        }

        function clearResistors() {
            resistors = [];
            renderResistors();
        }

        // Правильные расчеты на основе схемы
        function getCorrectValues() {
            if (resistors.length === 0) return { rTotal: 0, iTotal: 0 };
           
            let type = document.querySelector('input[name="connection"]:checked').value;
            let rTotal = 0;

            if (type === 'series') {
                rTotal = resistors.reduce((sum, val) => sum + val, 0);
            } else {
                let inverseSum = resistors.reduce((sum, val) => sum + (1 / val), 0);
                rTotal = 1 / inverseSum;
            }

            let uSource = 6.0;
            let iTotal = uSource / rTotal;

            return { rTotal: rTotal, iTotal: iTotal };
        }

        function updateCalc() {
            // Функция-триггер при изменении схемы
        }

        function checkAnswers() {
            let resultDiv = document.getElementById('result');
            if (resistors.length === 0) {
                resultDiv.style.color = "var(--error-color)";
                resultDiv.innerText = "⚠️ Добавьте хотя бы один резистор!";
                return;
            }

            let userR = parseFloat(document.getElementById('userR').value.replace(',', '.'));
            let userI = parseFloat(document.getElementById('userI').value.replace(',', '.'));

            if (isNaN(userR) || isNaN(userI)) {
                resultDiv.style.color = "var(--error-color)";
                resultDiv.innerText = "⚠️ Заполните оба поля числами!";
                return;
            }

            let correct = getCorrectValues();
           
            // Погрешность 7%
            let rCorrect = Math.abs(userR - correct.rTotal) <= (correct.rTotal * 0.07);
            let iCorrect = Math.abs(userI - correct.iTotal) <= (correct.iTotal * 0.07);

            if (rCorrect && iCorrect) {
                resultDiv.style.color = "var(--success-color)";
                resultDiv.innerText = "🎉 Всё верно! Отличный расчет цепи!";
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                resultDiv.style.color = "var(--error-color)";
                resultDiv.innerText = `❌ Есть ошибка.\nПравильно: R ≈ ${correct.rTotal.toFixed(2)} Ом, I ≈ ${correct.iTotal.toFixed(2)} А`;
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }
        }

        // Инициализация при старте
        renderResistors();
    </script>
</body>
</html>
