<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Лаборатория ОГЭ</title>
   
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
   
    <!-- Подключаем Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
   
    <!-- Подключаем библиотеку для перетаскивания (Drag & Drop) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
   
    <style>
        :root {
            --bg-body: #f4f7f9; --bg-card: #ffffff; --primary: #007AFF;
            --text-main: #1c1c1e; --text-muted: #8e8e93; --border: #e5e5ea;
            --danger: #ff3b30; --success: #34c759; --wire: #64748b;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-body); color: var(--text-main);
            margin: 0; padding: 20px 16px 100px 16px;
            display: flex; flex-direction: column; gap: 16px;
        }

        .header { text-align: center; margin-bottom: 8px; }
        .header h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px 0; color: #1c1c1e; letter-spacing: -0.5px; }
        .header p { font-size: 14px; margin: 0; color: var(--text-muted); font-weight: 500; }

        .card {
            background-color: var(--bg-card); border-radius: 20px; padding: 20px;
            box-shadow: var(--shadow); border: 1px solid rgba(0,0,0,0.02);
        }
       
        .card-title { font-size: 13px; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 16px; color: var(--primary); }

        select, input[type="number"], input[type="range"] {
            width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 14px;
            background: #fafafa; color: var(--text-main); font-size: 15px; font-weight: 500; outline: none; font-family: inherit;
        }
        select:focus, input[type="number"]:focus { border-color: var(--primary); background: #ffffff; }

        .oge-ticket {
            background-color: #fffdf8; color: #111; font-family: "Times New Roman", Times, serif;
            border: 1px solid #d1d5db; padding: 20px; font-size: 16px; line-height: 1.5;
            border-radius: 8px; margin: 16px 0; box-shadow: inset 0 0 20px rgba(0,0,0,0.02);
        }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .btn-add {
            background-color: #ffffff; color: var(--text-main); border: 1.5px solid var(--border);
            border-radius: 14px; padding: 12px 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-add:active { transform: scale(0.95); background-color: #f4f7f9; }

        /* ИНТЕРАКТИВНЫЙ РАБОЧИЙ СТОЛ */
        .workspace-wrapper {
            background-color: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 16px;
            padding: 20px; overflow-x: auto; min-height: 120px;
            display: flex; align-items: center; justify-content: flex-start;
        }
       
        .circuit-container {
            display: flex; align-items: center; gap: 30px; /* Расстояние для проводов */
            min-width: max-content; padding: 10px 0; margin: 0 auto;
        }

        /* ЭЛЕМЕНТЫ ЦЕПИ С ПРОВОДАМИ */
        .ws-chip {
            background-color: #ffffff; padding: 10px 16px 10px 10px; border-radius: 12px;
            font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px;
            border: 2px solid var(--primary); box-shadow: 0 4px 12px rgba(0, 122, 255, 0.15);
            position: relative; cursor: grab; user-select: none;
            animation: popIn 0.2s ease-out;
        }
        .ws-chip:active { cursor: grabbing; }
       
        /* Рисуем провода с помощью CSS */
        .ws-chip::after {
            content: ''; position: absolute; right: -32px; top: 50%;
            width: 32px; height: 4px; background: var(--wire);
            transform: translateY(-50%); z-index: 1;
            transition: opacity 0.2s; border-radius: 2px;
        }
        /* У последнего элемента провод не рисуем */
        .ws-chip:last-child::after { opacity: 0; }

        /* Эффект при перетаскивании */
        .sortable-ghost { opacity: 0.3; background: #e2e8f0; border-color: #cbd5e1; }
        .sortable-drag { cursor: grabbing !important; }

        .drag-handle { color: #cbd5e1; font-size: 18px; padding-right: 4px; }
        .chip-delete { background: none; border: none; color: var(--danger); font-size: 20px; cursor: pointer; padding: 0 0 0 8px; font-weight: bold; }
        .bulb-indicator { width: 14px; height: 14px; border-radius: 50%; background-color: #444; transition: all 0.3s ease; }

        /* ЭКРАН ПРИБОРОВ */
        .display-screen { display: flex; justify-content: space-between; background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%); color: #10b981; font-family: 'Courier New', Courier, monospace; padding: 24px; border-radius: 16px; font-size: 26px; font-weight: bold; box-shadow: inset 0 4px 15px rgba(0,0,0,0.6); text-shadow: 0 0 10px rgba(16, 185, 129, 0.5); border: 2px solid #334155; }
        .meter-label { font-size: 14px; color: #64748b; font-family: 'Inter', sans-serif; text-shadow: none; display: block; margin-bottom: 4px; }
       
        .controls { display: flex; gap: 10px; margin-top: 16px; }
        .btn-control { flex: 1; padding: 14px; border-radius: 14px; border: none; font-weight: 700; cursor: pointer; }
        .btn-key-open { background: #ffffff; border: 1.5px solid var(--border); }
        .btn-key-closed { background: var(--success); color: white; border: 1.5px solid var(--success); }
       
        .feedback-text { text-align: center; font-weight: 500; font-size: 15px; margin-top: 16px; padding: 10px; border-radius: 10px;}
        #webButton { display: none; width: 100%; padding: 16px; border-radius: 14px; background: var(--primary); color: white; font-size: 16px; font-weight: bold; border: none; cursor: pointer; margin-top: 12px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚡ Физика ОГЭ</h1>
        <p>Собери цепь руками (Drag & Drop)</p>
    </div>

    <div class="card">
        <div class="card-title">📝 1. КИМ (Задание)</div>
        <select id="taskSelect" onchange="generateTask()">
            <option value="resistor">Измерение сопротивления резистора</option>
            <option value="power">Измерение мощности тока</option>
        </select>
        <div class="oge-ticket" id="ticketText"></div>
    </div>

    <div class="card">
        <div class="card-title">🛠 2. Детали (Нажми, чтобы положить на стол)</div>
        <div class="grid">
            <button class="btn-add" onclick="addNode('battery', '🔋 Источник')">🔋 Источник</button>
            <button class="btn-add" onclick="addNode('key', '🔌 Ключ')">🔌 Ключ</button>
            <button class="btn-add" onclick="addNode('resistor', '📦 Резистор')">📦 Резистор</button>
            <button class="btn-add" onclick="addNode('bulb', '💡 Лампочка')">💡 Лампочка</button>
            <button class="btn-add" onclick="addNode('rheostat', '🎛 Реостат')">🎛 Реостат</button>
            <button class="btn-add" onclick="addNode('ammeter', '⏱ Амперметр')">⏱ Амперметр</button>
            <button class="btn-add" onclick="toggleVoltmeter()" style="border-color: #10b981; color: #10b981;">📊 Вольтметр (Параллельно)</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">🔧 3. Сборка (Перетаскивай детали пальцем!)</div>
       
        <div class="workspace-wrapper">
            <!-- Сюда падают детали, и здесь работает перетаскивание -->
            <div class="circuit-container" id="workspace"></div>
        </div>

        <div id="rheostatBox" style="display: none; background: #f8fafc; padding: 12px; border-radius: 12px; margin-top: 16px; border: 1px solid var(--border);">
            <label style="font-size: 13px; font-weight: 600; color: #475569;">Сопротивление реостата: <span id="rheoValue" style="color: var(--primary);">5</span> Ом</label>
            <input type="range" id="rheoSlider" min="0" max="15" step="1" value="5" oninput="updatePhysics()" style="margin-top: 8px;">
        </div>

        <div id="voltmeterBox" style="display: none; background: #f0fdf4; padding: 12px; border-radius: 12px; margin-top: 16px; border: 1px solid #10b981;">
            <label style="font-size: 13px; font-weight: 600; color: #047857;">К чему подключен вольтметр?</label>
            <select id="voltmeterTarget" onchange="updatePhysics()" style="margin-top: 8px; border-color: #10b981;">
                <option value="resistor">К Резистору</option>
                <option value="bulb">К Лампочке</option>
            </select>
        </div>

        <div class="controls">
            <button id="keyBtn" class="btn-control btn-key-open" onclick="toggleKey()">Ключ отключен</button>
            <button class="btn-control" onclick="clearTable()" style="background: #fff0f0; color: var(--danger);">🗑 Очистить</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📟 Показания приборов</div>
        <div class="display-screen">
            <div style="text-align: center;">
                <span class="meter-label">ВОЛЬТМЕТР</span>
                <span id="displayU">--</span><span style="font-size:16px; color:#10b98188;"> V</span>
            </div>
            <div style="text-align: center;">
                <span class="meter-label">АМПЕРМЕТР</span>
                <span id="displayI">--</span><span style="font-size:16px; color:#10b98188;"> A</span>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">✅ 4. Бланк ответов</div>
        <input type="number" id="userAnswer" placeholder="Ваш числовой ответ...">
        <button id="webButton" onclick="verifyAnswer()">Проверить ответ</button>
        <div id="feedback" class="feedback-text"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        if (!tg.initDataUnsafe || Object.keys(tg.initDataUnsafe).length === 0) {
            document.getElementById('webButton').style.display = 'block';
        } else {
            tg.MainButton.setText('ПРОВЕРИТЬ ОТВЕТ');
            tg.MainButton.color = '#007aff';
            tg.MainButton.textColor = '#ffffff';
            tg.MainButton.show();
            tg.MainButton.onClick(verifyAnswer);
        }

        let keyClosed = false;
        let hasVoltmeter = false;
        let secretR = 10;
        let currentTaskType = 'resistor';

        // Инициализация Drag and Drop для рабочего стола
        const workspace = document.getElementById('workspace');
        new Sortable(workspace, {
            animation: 200,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                if(tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                updatePhysics(); // Пересчитываем цепь при перетаскивании
            },
        });

        function generateTask() {
            currentTaskType = document.getElementById('taskSelect').value;
            secretR = Math.floor(Math.random() * 11) + 5;
           
            let html = "";
            if (currentTaskType === 'resistor') {
                html = `Используя оборудование, соберите цепь для определения сопротивления резистора.`;
                document.getElementById('userAnswer').placeholder = "Сопротивление R (Ом)";
            } else {
                html = `Используя оборудование и <b>лампочку</b>, соберите цепь для измерения мощности тока на лампочке.`;
                document.getElementById('userAnswer').placeholder = "Мощность P (Вт)";
            }
            document.getElementById('ticketText').innerHTML = html;
            clearTable();
        }

        // Добавление элемента на стол
        function addNode(id, name) {
            // Проверка на дубликаты
            if (workspace.querySelector(`[data-id="${id}"]`)) {
                if(tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
                return;
            }

            let chip = document.createElement('div');
            chip.className = 'ws-chip';
            chip.setAttribute('data-id', id);
           
            let bulb = id === 'bulb' ? `<div class="bulb-indicator" id="bulbGlow"></div>` : "";
           
            // HTML внутренностей чипа (с иконкой перетаскивания и крестиком)
            chip.innerHTML = `
                <span class="drag-handle">⋮⋮</span>
                ${bulb} ${name}
                <button class="chip-delete" onclick="this.parentElement.remove(); updatePhysics();">&times;</button>
            `;
           
            workspace.appendChild(chip);
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
           
            updatePhysics();
        }

        function toggleVoltmeter() {
            hasVoltmeter = !hasVoltmeter;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            updatePhysics();
        }

        function clearTable() {
            workspace.innerHTML = "";
            hasVoltmeter = false;
            keyClosed = false;
            document.getElementById('userAnswer').value = '';
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('feedback').style.background = 'transparent';
            updatePhysics();
        }

        function toggleKey() {
            if (!workspace.querySelector(`[data-id="key"]`)) return;
            keyClosed = !keyClosed;
            if(tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            updatePhysics();
        }

        // ГЛАВНЫЙ РАСЧЕТ ЦЕПИ (считывает порядок прямо из HTML)
        function updatePhysics() {
            // Убираем текст-заглушку, если есть элементы
            if (workspace.children.length === 0) {
                workspace.innerHTML = `<span style="color: #94a3b8; font-size: 14px;">Стол пуст. Добавь детали.</span>`;
            } else if (workspace.querySelector('span')) {
                let span = workspace.querySelector('span');
                if (span && !span.classList.contains('drag-handle')) span.remove();
            }

            // Читаем, что реально лежит на столе
            let nodes = Array.from(workspace.querySelectorAll('.ws-chip')).map(el => el.getAttribute('data-id'));
           
            let hasBattery = nodes.includes('battery');
            let hasKey = nodes.includes('key');
            let hasAmmeter = nodes.includes('ammeter');

            document.getElementById('rheostatBox').style.display = nodes.includes('rheostat') ? 'block' : 'none';
            document.getElementById('voltmeterBox').style.display = hasVoltmeter ? 'block' : 'none';

            let keyBtn = document.getElementById('keyBtn');
            if (hasKey) {
                keyBtn.innerText = keyClosed ? "Ключ: ЗАМКНУТ" : "Ключ: РАЗОМКНУТ";
                keyBtn.className = keyClosed ? "btn-control btn-key-closed" : "btn-control btn-key-open";
            } else {
                keyBtn.innerText = "Ключ отсутствует";
                keyBtn.className = "btn-control btn-key-open";
                keyClosed = false;
            }

            // Математика физики
            let totalR = 0.5; // Внутреннее сопротивление
            if (nodes.includes('resistor')) totalR += secretR;
            if (nodes.includes('bulb')) totalR += secretR;
            if (nodes.includes('rheostat')) {
                let rVal = parseInt(document.getElementById('rheoSlider').value);
                document.getElementById('rheoValue').innerText = rVal;
                totalR += rVal;
            }

            let I = 0, U = 0;
            let active = hasBattery && hasKey && keyClosed && (totalR > 0.5);

            if (active) {
                I = 4.5 / totalR;
                if (hasVoltmeter) {
                    let target = document.getElementById('voltmeterTarget').value;
                    if (target === 'resistor' && nodes.includes('resistor')) U = I * secretR;
                    if (target === 'bulb' && nodes.includes('bulb')) U = I * secretR;
                }
            }

            document.getElementById('displayI').innerText = (hasAmmeter && active) ? I.toFixed(2) : "--";
            document.getElementById('displayU').innerText = (hasVoltmeter && active && U > 0) ? U.toFixed(2) : "--";

            // Свечение лампы
            let glow = document.getElementById('bulbGlow');
            if (glow) {
                if (active && I > 0) {
                    let br = Math.min(255, Math.floor(I * 400));
                    glow.style.backgroundColor = `rgb(255, ${200 + br/5}, 0)`;
                    glow.style.boxShadow = `0 0 ${br/10}px ${br/20}px rgba(255, 215, 0, 0.9)`;
                } else {
                    glow.style.backgroundColor = '#444';
                    glow.style.boxShadow = 'none';
                }
            }
        }

        function verifyAnswer() {
            let ans = parseFloat(document.getElementById('userAnswer').value.replace(',', '.'));
            let fb = document.getElementById('feedback');
           
            if (isNaN(ans)) {
                fb.innerHTML = "⚠️ Введите число!"; fb.style.color = "var(--danger)";
                return;
            }

            let I = parseFloat(document.getElementById('displayI').innerText);
            let U = parseFloat(document.getElementById('displayU').innerText);

            if (isNaN(I) || isNaN(U) || I <= 0) {
                fb.innerHTML = "⚠️ Цепь не собрана. Измерьте значения!"; fb.style.color = "var(--danger)";
                return;
            }

            let correct = (currentTaskType === 'resistor') ? (U / I) : (U * I);
           
            if (Math.abs(ans - correct) <= correct * 0.15) {
                fb.innerHTML = `🎉 Верно! Ожидалось: ${correct.toFixed(1)}`;
                fb.style.color = "var(--success)"; fb.style.background = "#e6f9ed";
                if(tg.confetti) tg.confetti();
            } else {
                fb.innerHTML = `❌ Ошибка. Ожидалось: ${correct.toFixed(1)}`;
                fb.style.color = "var(--danger)"; fb.style.background = "#fff0f0";
            }
        }

        generateTask();
    </script>
</body>
</html>
